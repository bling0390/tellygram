name: personal-apk

# One user's personal APK, built on demand by the tellygram.app relay.
#
# Why repository_dispatch instead of workflow_dispatch: a repository_dispatch
# payload is not rendered into the run UI, while workflow_dispatch inputs are —
# and this repository is public, so anything printed here is world-readable.
# The credential still never travels in the payload: the runner fetches it once
# from the relay with a shared secret, masks it, and the relay forgets it.
#
# Secrets required on this repository:
#   RELAY_SECRET        shared with the relay; lets the runner fetch credentials
#   UPLOAD_SECRET       shared with the relay; lets the runner publish the APK
#   KEYSTORE_BASE64     base64 of the DISTRIBUTION keystore (not a personal one)
#   KEYSTORE_PASSWORD   store password
#   KEY_ALIAS           key alias
#   KEY_PASSWORD        key password
#   EXPECTED_CERT_SHA256 optional: the relay also checks the APK's signer

on:
  repository_dispatch:
    types: [personal-apk]

permissions:
  contents: read

concurrency:
  # Personal builds are independent; do not cancel one for another.
  group: personal-apk-${{ github.event.client_payload.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JOB_ID: ${{ github.event.client_payload.jobId }}
      RELAY: ${{ github.event.client_payload.relay }}
      ABI: ${{ github.event.client_payload.abi }}
    steps:
      - name: Fetch the credential once, from the relay
        env:
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
        run: |
          set -euo pipefail
          : "${JOB_ID:?missing jobId}"
          : "${RELAY:?missing relay}"
          creds="$RUNNER_TEMP/creds.json"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer $RELAY_SECRET" \
            "$RELAY/ci/creds/$JOB_ID" -o "$creds"
          ID=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["api_id"])' "$creds")
          HASH=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["api_hash"])' "$creds")
          # Mask before anything else can print them: from here on GitHub
          # redacts these values wherever they appear in the log.
          echo "::add-mask::$ID"
          echo "::add-mask::$HASH"
          {
            echo "TG_API_ID=$ID"
            echo "TG_API_HASH=$HASH"
          } >> "$GITHUB_ENV"
          rm -f "$creds"
          echo "abi=${ABI:-arm64-v8a}" >> "$GITHUB_OUTPUT"
        id: creds

      - name: Resolve the ref to build
        id: ref
        run: |
          set -euo pipefail
          REF="${{ github.event.client_payload.ref }}"
          # Only a plain vX.Y.Z tag is accepted; anything else (empty, or a value
          # someone managed to smuggle in) falls back to the default branch.
          case "$REF" in
            v[0-9]*.[0-9]*.[0-9]*) echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "building release $REF" ;;
            *) echo "ref="; echo "no release tag in the dispatch payload - building the default branch" ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref || github.event.repository.default_branch }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          # Deliberately not android-actions/setup-android: it installs the
          # "tools" package, which no longer exists in current SDK repos, and
          # the job dies with "Failed to find package 'tools'". The runner image
          # already ships the SDK, so accept licences and assert what we need.
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          [ -n "$SDKMGR" ] || { echo "no sdkmanager under $SDK"; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;34.0.0" >/dev/null || true
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Write signing config (from secrets, into the work tree only)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dist.keystore"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/dist.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # A minimal local.properties: BUILD_NUMBER bookkeeping needs the file,
          # and it must NOT carry credentials (they come from the environment).
          printf 'BUILD_NUMBER=%s\nsdk.dir=%s\n' "${GITHUB_RUN_NUMBER:-1}" "$ANDROID_SDK_ROOT" > local.properties

      - name: Build release APK
        id: build
        run: |
          set -euo pipefail
          ABI="${{ steps.creds.outputs.abi }}"
          ./gradlew :app:assembleRelease -Pabi="$ABI" --no-daemon --stacktrace
          # -Pabi=<arch> makes gradle emit exactly one artifact, named
          # app-<arch>-release.apk. -Pabi=universal turns splits off, so that
          # build produces a plain app-release.apk with no ABI in the name —
          # hence the fallback.
          APK=$(find app/build/outputs/apk/release -name "*${ABI}*.apk" | head -1)
          [ -n "$APK" ] || APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -n "$APK" ] || { echo "no APK produced"; exit 1; }
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -l "$APK"

      - name: Publish to the relay (single-use upload)
        env:
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
        run: |
          set -euo pipefail
          APK="${{ steps.build.outputs.apk }}"
          # The relay refuses anything not signed by the distribution key, so
          # report the signer certificate's SHA-256 for it to verify server-side.
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          OUT=$("$BT/apksigner" verify --print-certs "$APK" 2>&1 \
                | sed -e 's/\x1b\[[0-9;]*m//g' || true)
          FP=$(printf '%s\n' "$OUT" | sed -n 's/.*SHA-256 digest:[[:space:]]*//p' \
                | head -1 | tr -d ':\r ' | tr 'A-F' 'a-f')
          if ! printf '%s' "$FP" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "could not parse the signer fingerprint — raw apksigner output:"
            printf '%s\n' "$OUT" | head -20
            exit 1
          fi
          echo "signer sha256: $FP"
          # Version comes from the APK itself, so the relay can name the file
          # and the page can show which build this is.
          BADGING=$("$BT/aapt2" dump badging "$APK" 2>/dev/null | head -1)
          VER=$(printf '%s' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VCODE=$(printf '%s' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          echo "apk version: $VER (code $VCODE), abi $ABI"
          REF="${{ steps.ref.outputs.ref }}"
          if [ -n "$REF" ] && [ "$REF" != "v$VER" ]; then
            echo "::warning::tag $REF does not match the APK version $VER - bump baseVersion before tagging"
          fi
          curl -fsS --max-time 300 -X PUT \
            -H "Authorization: Bearer $UPLOAD_SECRET" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "X-Apk-Cert-Sha256: $FP" \
            -H "X-Apk-Version: $VER" \
            -H "X-Apk-Version-Code: $VCODE" \
            --data-binary @"$APK" \
            "$RELAY/ci/upload/$JOB_ID"
